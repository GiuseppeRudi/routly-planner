project:
  project_root: "."
  seed: 71

experiment:
  name_prefix: "experiment"

osm:
  place_name: "Bologna, Emilia-Romagna, Italy"
  network_type: "drive"

graph_simplification:
  keep_largest_component: true
  remove_isolated_nodes: true
  distance_meters: 1000
  max_nodes: 500

planner:
  enhsp_jar: "planners/enhsp/enhsp-20.jar"

sumo:
  sumo_gui: "sumo-gui"

features:
  traffic_lights:
    enabled: true
    green_duration:
      min: 20
      max: 30
    yellow_duration:
      min: 3
      max: 6
    red_duration:
      min: 20
      max: 30

  # No congestion = {enabled: false}
  # congestion = {enabled: true, replanning: false, type: static, mode: sumo}
  # congestion = {enabled: true, replanning: false, type: static, mode: pddl}
  # congestion = {enabled: true, replanning: false, type: dynamic, mode: pddl}
  # congestion controller = {enabled: true, replanning: true, type: dynamic, mode: pddl}
  congestion:
    enabled: true
    mode: "pddl" # "sumo" | "pddl"
    type: "static" # "static" | "dynamic"
    replanning: false
    num_background_vehicles: 200
    congestion_factor: 2.0
    dynamic:
      window_seconds: 30
    vehicles_for_max_congestion_by_road_class:
      local: 20
      arterial: 35
      major: 50

  # Shared settings for offline replanning controllers.
  # The active controller is selected by fuel.replanning or congestion.replanning.
  controller:
    replan_window_seconds: 30
    max_iterations: 50

  llm_events:
    # Runtime LLM provider/model are configured in .env:
    # ROUTLY_LLM_PROVIDER and ROUTLY_LLM_MODEL.
    enabled: true
    strategic_injection: true # if true, LLM picks roads from compact topology (start/goal/degree) instead of random sampling
    prevent_unsolvable_blocks: true
    # false: gives an error in case of unsolvable paths
    # true: puts a slowdown instead of a blocked road that blocked the path to the goal state
    unsolvable_fallback: "slowdown" # "slowdown" | "skip"
    unsolvable_fallback_severity: 5.0

  sumo:
    plans:
      - base
      - dynamic
    open_event_map: true # opens the route comparison with the genretaed events
    open_congestion_map: true
  

  # No fuel = {enabled : false 
  # Fuel = {replanning : false , consumption_mode : discrete}
  # Fuel = {replanning : false , consumption_mode : continuous} 
  # Fuel = {replanning : true , consumption_mode : discrete} 
  # Fuel = {replanning : true , consumption_mode : continuous} 


  
  fuel:
    enabled: false # if true max_nodes must be decreased
    replanning: false # true activates the offline fuel controller
    stations_ratio: 0.15 # % of the nodes become fuel stations
    initial_fuel_ratio: 0.8 # start with % of a full tank
    stations_source: random # "random" | "osm"
    consumption_mode: discrete   # "discrete" | "continuous"
    # if consumption_mode = discrete, then max_nodes <= 150
    # if consumption_mode = continuous, then max_nodes <= 100
