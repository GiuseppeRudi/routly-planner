project:
  project_root: "."
  seed: 71

experiment:
  name_prefix: "experiment"

osm:
  place_name: "Bologna, Emilia-Romagna, Italy"
  network_type: "drive"

graph_simplification:
  keep_largest_component: true
  remove_isolated_nodes: true
  distance_meters: 1000
  max_nodes: 300

planner:
  enhsp_jar: "planners/enhsp/enhsp-20.jar"
  java_heap_mb: 8192
  traversal_model: "compiled_duration" # "process" | "compiled_duration"
  # traversal_model controls the PDDL representation of road traversal.
  # process uses a start action, continuous process, and arrival event. It
  # requires node_based state and parameterized actions.
  # compiled_duration uses direct numeric actions and supports the grounding
  # strategies selected below.
  #
  # state_representation:
  #   node_based: vehicle state is a graph node/location; roads are traversal edges.
  #   line_graph: vehicle state is a road/edge. Both parameterized and compiled
  #               action generation are recognized, but neither is implemented yet.
  #
  # action_generation:
  #   parameterized: one generic PDDL action schema, grounded by the planner.
  #   compiled: generate only valid road/window action schemas in Python.
  #
  # Valid combinations:
  #   process + node_based + parameterized (the only process combination)
  #   compiled_duration + node_based + parameterized
  #   compiled_duration + node_based + compiled
  # Recognized for future development (currently raises "not implemented yet"):
  #   compiled_duration + line_graph + parameterized
  #   compiled_duration + line_graph + compiled
  state_representation: "node_based" # "node_based" | "line_graph"
  action_generation: "compiled" # "parameterized" | "compiled"

sumo:
  sumo_gui: "sumo-gui"

features:
  traffic_lights:
    enabled: true
    green_duration:
      min: 20
      max: 30
    yellow_duration:
      min: 3
      max: 6
    red_duration:
      min: 20
      max: 30

  road_abstraction:
    enabled: true
    max_segments_per_macro: 8
    max_length_meters: 1500
    speed_tolerance_ratio: 0.15
    require_same_capacity_class: true

  # Supported congestion configurations:
  #   disabled: enabled=false
  #   SUMO only: enabled=true, replanning=false, type=static, mode=sumo
  #   PDDL snapshot: enabled=true, replanning=false, type=static, mode=pddl
  #   PDDL windows: enabled=true, replanning=false, type=dynamic|hybrid, mode=pddl
  #   controller: enabled=true, replanning=true, type=static, mode=pddl
  congestion:
    enabled: true
    mode: "pddl" # "sumo" | "pddl"
    type: "hybrid" # "static" | "dynamic" | "hybrid"
    replanning: false # requires traversal_model=process; mutually exclusive with fuel.replanning
    num_background_vehicles: 200
    congestion_factor: 2.0
    dynamic:
      window_seconds: 30
      hybrid:
        # Hybrid marks a road as dynamic only when its congestion factor
        # varies enough across time windows: max(window)-min(window) >= threshold.
        # Roads below the threshold remain static for the planner.
        min_temporal_variation: 0.10
    vehicles_for_max_congestion_by_road_class:
      local: 20
      arterial: 35
      major: 50

  # Shared settings for offline replanning controllers.
  # The active controller is selected by fuel.replanning or congestion.replanning.
  # Exactly one replanning flag may be true. Both controllers require:
  # planner.traversal_model=process, state_representation=node_based,
  # action_generation=parameterized.
  controller:
    replan_window_seconds: 30
    max_iterations: 50

  llm_events:
    # Runtime LLM provider/model are configured in .env:
    # ROUTLY_LLM_PROVIDER and ROUTLY_LLM_MODEL.
    enabled: true
    strategic_injection: true # if true, LLM picks roads from compact topology (start/goal/degree) instead of random sampling
    prevent_unsolvable_blocks: true
    # Convert path-breaking closures to the configured fallback when enabled.
    unsolvable_fallback: "slowdown" # "slowdown" | "skip"
    unsolvable_fallback_severity: 5.0

  sumo:
    plans:
      - base
      - dynamic
    open_event_map: true # Open the route comparison for generated events.
    open_congestion_map: true
  # Supported fuel configurations:
  #   disabled: enabled=false
  #   PDDL: enabled=true, replanning=false, consumption_mode=discrete|continuous
  #   controller: enabled=true, replanning=true, consumption_mode=discrete|continuous

  fuel:
    enabled: false
    replanning: false # requires traversal_model=process; mutually exclusive with congestion.replanning
    stations_ratio: 0.15 # Fraction of nodes used as fuel stations.
    initial_fuel_ratio: 0.8 # Initial fuel as a fraction of tank capacity.
    stations_source: random # "random" | "osm"
    consumption_mode: continuous # "discrete" | "continuous"
    # Recommended limits: max_nodes<=150 for discrete and <=100 for continuous.
    refuel_stop_seconds: float = 10.0
