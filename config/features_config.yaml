features:
  traffic_lights:
    enabled: true
    green_duration:
      min: 20
      max: 30
    yellow_duration:
      min: 3
      max: 6
    red_duration:
      min: 20
      max: 30

  congestion:
    mode: "pddl" # "none" | "sumo_only" | "pddl"
    num_background_vehicles: 200   # only if mode is not "none"
    congestion_factor: 2.0     # speed / congestion_factor on congested roads (only if mode: "pddl")
    # If OSM highway is missing or unknown, the road is treated as local.
    vehicles_for_max_congestion_by_road_class:
      local: 20
      arterial: 35
      major: 50

  llm_events:
    enabled: true
    backend: "ollama" # "ollama" | "lmstudio"
    strategic_injection: true # if true, LLM picks roads from compact topology (start/goal/degree) instead of random sampling

  sumo:
    plans:
      - base
      - dynamic
    open_event_map: true
  
  fuel:
    enabled: true # if true max_nodes must be decreased
    stations_ratio: 0.15 # % of the nodes become fuel stations
    initial_fuel_ratio: 0.8 # start with % of a full tank
    stations_source: random # "random" | "osm"
    consumption_mode: continuous   # "discrete" | "continuous"
    # if consumption_mode = discrete, then max_nodes <= 150
    # if consumption_mode = continuous, then max_nodes <= 100
 