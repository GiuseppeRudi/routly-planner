name: routly

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  - pip

  # Geospatial / OpenStreetMap
  - osmnx
  - geopandas
  - shapely
  - pyproj
  - fiona
  - folium
  - contextily

  # Graphs and data
  - networkx
  - pandas
  - numpy
  - pyyaml

  # Visualization
  - matplotlib
  - pillow
  - plotly

  # Development
  - jupyterlab
  - ipykernel
  - black
  - pytest

  # Pip-only packages
  - pip:
      - python-dotenv
      - rich
      - traci
